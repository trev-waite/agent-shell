# Distributed profile: Redis + Postgres + gateway + N workers.
# Usage:
#   docker compose up --build --scale worker=3
# Point clients at http://localhost:4310
#
# Local-first DX is unchanged: bun run dev:server (SQLite, no Docker).

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - relay_pg:/var/lib/postgresql/data

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["bun", "apps/gateway/src/index.ts"]
    ports:
      - "4310:4310"
    environment:
      REDIS_URL: redis://redis:6379
      RELAY_DATABASE_URL: postgres://relay:relay@postgres:5432/relay
      RELAY_PORT: "4310"
      RELAY_HOST: "0.0.0.0"
      RELAY_CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["bun", "apps/worker/src/index.ts"]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      RELAY_DATABASE_URL: postgres://relay:relay@postgres:5432/relay
      WORKSPACE_DIR: /workspace
      WORKER_CONCURRENCY: "4"
      # WORKER_ID defaults to hostname inside the container (unique per replica)
    volumes:
      - ${RELAY_WORKSPACE:-.}:/workspace:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  relay_pg:
